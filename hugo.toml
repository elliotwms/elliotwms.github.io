baseURL = "https://elliot.wales"
title = "Elliot Williams"
locale = "en-GB"
enableInlineShortcodes = true
# Exposes .GitInfo for pages with showLastUpdated (needs full history, see fetch-depth in CI)
enableGitInfo = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[params]
mainSections = ["posts"]
description = "Computer Person"
dark = "auto"
highlight = true
# Buttondown username, used by the subscribe form
buttondown = "elliotwms"

[menu]
[[menu.main]]
identifier = "posts"
name = "posts"
title = "posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "talks"
name = "talks"
title = "talks"
url = "/talks/"
weight = 20

[[menu.main]]
identifier = "projects"
name = "projects"
title = "projects"
url = "/projects/"
weight = 30

[[menu.main]]
identifier = "about"
name = "about"
title = "about"
url = "/about/"
weight = 40

[[menu.main]]
identifier = "subscribe"
name = "subscribe"
title = "subscribe"
url = "/subscribe/"
weight = 50

# Where Hugo gets each page's "last modified" date (.Lastmod), first match wins.
# Hugo's default puts the git commit date (":git") first once enableGitInfo is on,
# which would make posts show "Updated <date>" after any later commit (typo fixes,
# reformatting). Leaving ":git" out keeps posts using the dates in their front matter;
# the wishlist reads its git date directly via .GitInfo instead.
[frontmatter]
lastmod = ["lastmod", "modified", "date", "publishDate"]

[markup.goldmark.renderer]
# Allows HTML in Markdown
unsafe = true

# Embed YouTube videos from youtube-nocookie.com
[privacy.youtube]
privacyEnhanced = true
